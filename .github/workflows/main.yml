name: Job concurrency

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.0
      - name: Install Dependencies
        run: npm run build
      - name: Deploy App
        run: echo "App deployment"
